name: installers

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to verify'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh -n scripts/install.sh
      - run: python3 tests/install.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Verify Windows PowerShell 5.1 installer using a WSL fixture
        shell: powershell
        run: ./tests/install-windows.ps1
